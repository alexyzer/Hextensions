plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    //Hex Casting fabric
    modImplementation(rootProject.files("libs/hexcasting-fabric-$rootProject.minecraft_version-${rootProject.hexcasting_version}.jar"))

    //HexCasting runtime dependencies
    /* Paucal  * * * * * * * * */ modRuntimeOnly("at.petra-k:paucal:$rootProject.paucal_version+$rootProject.minecraft_version-fabric")
    /* Patchouli * * * * * * * */ modRuntimeOnly("vazkii.patchouli:Patchouli:$rootProject.minecraft_version-$rootProject.patchouli_version-FABRIC-SNAPSHOT")
    /* Fabric Language Kotlin  */ modRuntimeOnly("net.fabricmc:fabric-language-kotlin:$rootProject.kotlin_fabric_version")
    /* Cloth Config API  * * * */ modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version")
    /* Cardinal Components API */ modRuntimeOnly("org.ladysnake.cardinal-components-api:cardinal-components-api:$rootProject.cardinal_components_version")
    /* Fabric API  * * * * * * */ modRuntimeOnly("net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version")
    /* Inline  * * * * * * * * */ modRuntimeOnly("com.samsthenerd.inline:inline-fabric:$rootProject.minecraft_version-$rootProject.inline_version")

    //Inline runtime dependencies
    /* Cloth Config API */ modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version")
    /* Fabric API * * * */ modRuntimeOnly("net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
